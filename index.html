const months=Object.keys(DATA).sort();const $=id=>document.getElementById(id);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;const f1=v=>v==null?"-":(Math.round(v*10)/10).toFixed(1);
const KEYS=[0,2,...ITEMS.map((_,i)=>i+3)];const LAB=k=>k==0?"総合":k==2?"回答率":ITEMS[k-3];
function stats(m){const st=DATA[m].stores,names=Object.keys(st),av={};KEYS.forEach(i=>av[i]=avg(names.map(n=>st[n].s[i])));
 const rankBy=k=>{const o={};names.forEach(n=>o[n]=1+names.filter(x=>st[x].s[k]>st[n].s[k]).length);return o};
 const rk=[...names].sort((a,b)=>st[b].s[0]-st[a].s[0]);return{st,names,av,rk,rankBy,inR:rankBy(0)}}
function cls(v,a){if(a==null)return"";const d=v-a;return d<=-5?"vlo":d<0?"lo":d>=5?"hi":""}
function diff(v,p){if(p==null)return'<span style="color:#aaa">-</span>';const d=Math.round((v-p)*10)/10;return d>0?`<span class="up">▲${d}</span>`:d<0?`<span class="dn">▼${-d}</span>`:"±0"}
function areaOf(n){for(const a in AREAS)if(AREAS[a].includes(n))return a;return"未分類"}
const legend=`<div class="legend"><span class="lo">平均未満</span><span class="vlo">平均-5pt以下</span><span class="hi">平均+5pt以上</span> ※ブランド平均・ブランド順位は送付分の焼売のジョー・魚の登竜門・金目樽 店舗のみで算出</div>`;
const cur=()=>$("month").value,cmpM=()=>$("cmp").value;
let sortKey=0;
function head(){return`<tr><th>ブランド順位<br><small>${LAB(sortKey)}</small></th><th>店舗</th><th>エリア</th>${KEYS.map(k=>`<th class="th-sort ${k==sortKey?"cur":""}" onclick="sortKey=${k};render()">${LQ(k)}</th>`).join("")}</tr>`}
function row(n,S,P){const RK=S.rankBy(sortKey),s=S.st[n].s,p=P&&P.st[n]?P.st[n].s:null;
 return`<tr><td><b>${RK[n]}</b></td><td class="n"><a href="#" onclick="openStore('${n}');return false">${n}</a></td><td>${areaOf(n).replace("エリア","")}</td>${KEYS.map(k=>`<td class="${cls(s[k],S.av[k])}">${k==0?"<b>":""}${s[k]}${k==2?"%":""}${k==0?"</b>":""}<br><small>${diff(s[k],p&&p[k])}</small></td>`).join("")}</tr>`}
function avgRow(lbl,S,names){return`<tr class="avg"><td colspan="3">${lbl}</td>${KEYS.map(k=>`<td>${f1(avg(names.map(n=>S.st[n].s[k])))}${k==2?"%":""}</td>`).join("")}</tr>`}
function renderSum(S,P){const n=S.names.length,best=S.rk[0],worst=S.rk[n-1];const ia=ITEMS.map((t,i)=>[t,S.av[i+3]]).sort((a,b)=>a[1]-b[1]);
 const sorted=[...S.names].sort((a,b)=>S.st[b].s[sortKey]-S.st[a].s[sortKey]);
 $("sum").innerHTML=`<div class="cards"><div class="card"><small>対象店舗数</small><b>${n}店舗</b></div><div class="card"><small>ブランド平均（総合）</small><b>${f1(S.av[0])}点</b>${P?`<small>前回 ${f1(P.av[0])} ${diff(S.av[0],P.av[0])}</small>`:""}</div><div class="card"><small>ブランド平均回答率</small><b>${f1(S.av[2])}%</b></div><div class="card"><small>ブランド1位</small><b>${S.st[best].s[0]}点</b><small>${best}</small></div><div class="card"><small>ブランド最下位</small><b>${S.st[worst].s[0]}点</b><small>${worst}</small></div><div class="card"><small>平均が最も低い項目</small><b>${QI(ia[0][0])}</b><small>${f1(ia[0][1])}点 / 次点 ${ia[1][0]} ${f1(ia[1][1])}点</small></div></div>
 <div class="box"><h3>店舗別スコア一覧（${cur()}${P?` ／ 比較：${cmpM()}`:""}）</h3>${legend}<div class="tw sk"><table>${head()}${avgRow("ブランド平均",S,S.names)}${sorted.map(x=>row(x,S,P)).join("")}</table></div><div class="note">見出し（総合・回答率・各項目）タップで並び替え・ブランド順位が切り替わります。各セル下段は前回比。</div></div>`}
function renderArea(S,P){let h=`<div class="box"><h3>エリア別スコア（${cur()}）</h3>${legend}<div class="tw sk"><table>${head()}${avgRow("ブランド平均",S,S.names)}`;
 const g0={};S.names.forEach(n=>(g0[areaOf(n)]=g0[areaOf(n)]||[]).push(n));
 Object.keys(AREAS).concat(["未分類"]).forEach(a=>{const g=g0[a];if(!g)return;g.sort((x,y)=>S.st[y].s[sortKey]-S.st[x].s[sortKey]);const ga=k=>avg(g.map(n=>S.st[n].s[k]));
  h+=`<tr class="area"><td colspan="3">${a}（${g.length}店舗）平均</td>${KEYS.map(k=>`<td class="${cls(ga(k),S.av[k])}">${f1(ga(k))}${k==2?"%":""}</td>`).join("")}</tr>`+g.map(x=>row(x,S,P)).join("")});
 const miss=Object.values(AREAS).flat().filter(n=>!S.st[n]);
 $("area").innerHTML=h+`</table></div><div class="note">見出しタップでエリア内の並び順とブランド順位が切り替わります。</div>${miss.length?`<div class="note">データ未登録：${miss.join("、")}</div>`:""}</div>`}

 let h=`<div class="box"><label>店舗：<select id="ss">${Object.keys(AREAS).map(a=>`<optgroup label="${a}">${AREAS[a].filter(n=>S.st[n]).map(n=>`<option ${n==selStore?"selected":""}>${n}</option>`).join("")}</optgroup>`).join("")}</select></label></div>`;
 h+=`<div class="cards"><div class="card"><small>総合</small><b>${s[0]}点</b><small>ブランド平均 ${f1(S.av[0])} / 前回比 ${diff(s[0],p&&p[0])}</small></div><div class="card"><small>ブランド順位（総合）</small><b>${S.inR[selStore]}位</b><small>/${S.names.length}店舗${p?` ／ 前回 ${P.inR[selStore]}位`:""}</small></div><div class="card"><small>回答率</small><b>${s[2]}%</b><small>ブランド平均 ${f1(S.av[2])}%</small></div></div>`;
 h+=`<div class="box"><h3>項目別スコア</h3>${legend}<div class="tw sk1"><table class="dt"><tr><th style="width:110px">項目</th><th style="width:60px">自店舗</th><th>スコア（｜＝ブランド平均）</th><th style="width:80px">ブランド平均</th><th style="width:60px">平均差</th><th style="width:70px">ブランド順位</th>${p?`<th style="width:60px">前回</th><th style="width:60px">前回比</th>`:""}</tr>${ITEMS.map((t,i)=>{const k=i+3,v=s[k],a=S.av[k],rk=S.rankBy(k)[selStore],c=v-a<=-5?"#f08a4b":v<a?"#f2c94c":v-a>=5?"#2e9e5b":"#5b8def";return`<tr><td class="n"><b>${QI(t)}</b></td><td class="${cls(v,a)}" style="font-size:15px"><b>${v}</b></td><td><div class="bar"><div style="width:${v}%;background:${c}"></div><i style="left:${a}%"></i></div></td><td>${f1(a)}</td><td>${diff(v,a)}</td><td>${rk}位</td>${p?`<td>${p[k]}</td><td>${diff(v,p[k])}</td>`:""}</tr>`}).join("")}</table></div></div>`;
 h+=`<div class="box"><h3>愛されMVP</h3><div class="mvp">${d.l.map((m,i)=>`<div><b>${i+1}位 ${m[0]}</b>（${m[1]}票）</div>`).join("")}</div></div><div class="box"><h3>リーダーシップMVP</h3><div class="mvp">${d.L.map((m,i)=>`<div><b>${i+1}位 ${m[0]}</b>（${m[1]}票）<ul>${m[2].split("／").map(c=>`<li>${c}</li>`).join("")}</ul></div>`).join("")}</div></div>`;
 $("store").innerHTML=h;$("ss").onchange=e=>{selStore=e.target.value;render()}}
let TH=5;
function renderTend(S,P){const el=$("tend");if(!P){el.innerHTML='<div class="box">比較月を選択してください。</div>';return}
 const IK=[0,...ITEMS.map((_,i)=>i+3)],ups=[],dns=[];
 S.names.forEach(n=>{if(!P.st[n])return;const s=S.st[n].s,p=P.st[n].s;IK.forEach(i=>{const d=s[i]-p[i];if(Math.abs(d)>=TH)(d>0?ups:dns).push({n,a:areaOf(n),it:LAB(i),p:p[i],v:s[i],d})})});
 ups.sort((a,b)=>b.d-a.d);dns.sort((a,b)=>a.d-b.d);
 const cnt=(L,k)=>{const o={};L.forEach(x=>o[x[k]]=(o[x[k]]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>`${x[0]}（${x[1]}）`).join("、")||"-"};
 const tbl=(L,c)=>L.length?`<div class="tw sk1"><table><tr><th>店舗</th><th>エリア</th><th>項目</th><th>${cmpM()}</th><th>${cur()}</th><th>増減</th></tr>${L.map((x,i)=>`<tr class="${i>=25?"px":""}"><td class="n">${x.n}</td><td>${x.a.replace("エリア","")}</td><td>${QI(x.it)}</td><td>${x.p}</td><td>${x.v}</td><td class="${c}"><b>${x.d>0?"▲":"▼"}${Math.abs(x.d)}</b></td></tr>`).join("")}</table></div>${L.length>25?`<div class="note ponly">※PDFは上位25件を表示（他${L.length-25}件は画面で確認）</div>`:""}`:'<div class="note">該当なし</div>';
 el.innerHTML=`<div class="box"><h3>傾向（${cmpM()} → ${cur()}）</h3><label>ピックアップ基準：±<select id="th">${[3,5,8,10].map(v=>`<option ${v==TH?"selected":""}>${v}</option>`).join("")}</select>pt以上</label>
 <div class="tw sk1" style="margin-top:8px"><table><tr><th>ブランド平均</th>${IK.map(k=>`<th>${LQ(k)}</th>`).join("")}</tr><tr><td>${cmpM()}</td>${IK.map(k=>`<td>${f1(P.av[k])}</td>`).join("")}</tr><tr><td>${cur()}</td>${IK.map(k=>`<td>${f1(S.av[k])}</td>`).join("")}</tr><tr><td>増減</td>${IK.map(k=>{const d=S.av[k]-P.av[k];return`<td class="${d>0?"up":d<0?"dn":""}"><b>${d>0?"▲":d<0?"▼":"±"}${f1(Math.abs(d))}</b></td>`}).join("")}</tr></table></div></div>
 <div class="grid"><div class="box"><h3 style="border-color:#0a7a3d">上昇ピックアップ（${ups.length}件）</h3><div class="note">店舗別件数：${cnt(ups,"n")}<br>項目別件数：${cnt(ups,"it")}</div>${tbl(ups,"up")}</div>
 <div class="box"><h3 style="border-color:#c62828">減少ピックアップ（${dns.length}件）</h3><div class="note">店舗別件数：${cnt(dns,"n")}<br>項目別件数：${cnt(dns,"it")}</div>${tbl(dns,"dn")}</div></div>
 <div class="note">回答率は対象外。比較月にデータがない店舗は除外。</div>`;$("th").onchange=e=>{TH=+e.target.value;renderTend(S,P)}}
let trendItem=0;
function renderTrend(){const all=[...new Set(months.flatMap(m=>Object.keys(DATA[m].stores)))],SS=months.map(stats);
 let h=`<div class="box"><h3>月別推移（${LQ(trendItem)}）</h3><label>指標：<select id="ti">${KEYS.map(k=>`<option value="${k}" ${k==trendItem?"selected":""}>${LAB(k)}</option>`).join("")}</select></label>
 <div class="tw sk" style="margin-top:8px"><table><tr><th>エリア</th><th>店舗</th>${months.map(m=>`<th>${m}<br><small>値／ブランド順位</small></th>`).join("")}<th>初回→最新</th></tr>
 <tr class="avg"><td colspan="2">ブランド平均</td>${SS.map(S=>`<td>${f1(S.av[trendItem])}</td>`).join("")}<td>${months.length>1?diff(SS.at(-1).av[trendItem],SS[0].av[trendItem]):"-"}</td></tr>`;
 Object.keys(AREAS).forEach(a=>AREAS[a].filter(n=>all.includes(n)).forEach(n=>{const vals=months.map(m=>DATA[m].stores[n]?DATA[m].stores[n].s[trendItem]:null),k=vals.filter(v=>v!=null);
  h+=`<tr><td>${a.replace("エリア","")}</td><td class="n">${n}</td>${vals.map((v,j)=>`<td class="${v==null?"":cls(v,SS[j].av[trendItem])}">${v==null?"-":`<b>${v}</b> <small>(${SS[j].rankBy(trendItem)[n]}位)</small>`}${j>0&&v!=null?"<br><small>"+diff(v,vals[j-1])+"</small>":""}</td>`).join("")}<td>${k.length>1?diff(k.at(-1),k[0]):"-"}</td></tr>`}));
 $("trend").innerHTML=h+`</table></div></div>`;$("ti").onchange=e=>{trendItem=+e.target.value;renderTrend()}}

let arKey=0;
function renderARank(S,P){const IK=[0,...ITEMS.map((_,i)=>i+3)];
 const calc=(X,k)=>{const r=[];Object.keys(AREAS).forEach(a=>{const g=AREAS[a].filter(n=>X.st[n]);if(g.length)r.push({a,g,v:avg(g.map(n=>X.st[n].s[k]))})});r.sort((x,y)=>y.v-x.v);r.forEach(x=>x.r=1+r.filter(y=>y.v>x.v+1e-9).length);return r};
 const R=calc(S,arKey),PR=P?calc(P,arKey):[],pm={};PR.forEach(x=>pm[x.a]=x);const av=S.av[arKey];
 const mx=Math.max(...R.map(x=>x.v)),mn=Math.min(...R.map(x=>x.v)),lo=Math.max(0,Math.floor(mn-8));
 let h=`<div class="box"><h3>エリアランキング（${cur()}${P?` ／ 比較：${cmpM()}`:""}）</h3><div class="chips">${IK.map(k=>`<button class="${k==arKey?"on":""}" onclick="arKey=${k};render()">${LQ(k)}</button>`).join("")}</div>
 <div class="tw sk1"><table><tr><th>順位</th><th>エリア</th><th>${LQ(arKey)}平均</th><th style="min-width:120px">スコア（｜＝ブランド平均）</th><th>ブランド平均差</th>${P?"<th>前回</th><th>前回比</th><th>前回順位</th>":""}<th>店舗内訳（${LAB(arKey)}）</th></tr>`;
 R.forEach(x=>{const p=pm[x.a],w=(v)=>((v-lo)/(100-lo)*100).toFixed(1),c=x.v-av>=0?"#2e9e5b":"#f08a4b";
  const mem=[...x.g].sort((a,b)=>S.st[b].s[arKey]-S.st[a].s[arKey]).map(n=>{const v=S.st[n].s[arKey];return`<span class="${cls(v,av)}" style="padding:0 3px;border-radius:3px">${n.replace("焼売のジョー","")} ${v}</span>`}).join("　");
  h+=`<tr class="${x.r==1?"rk1":""}"><td><span class="medal ${x.r<=3?"m"+x.r:""}">${x.r}</span></td><td class="n"><b>${x.a}</b><br><small>${x.g.length}店舗</small></td><td style="font-size:16px"><b>${f1(x.v)}</b></td><td><div class="bar"><div style="width:${w(x.v)}%;background:${c}"></div><i style="left:${w(av)}%"></i></div></td><td>${diff(x.v,av)}</td>${P?`<td>${p?f1(p.v):"-"}</td><td>${p?diff(x.v,p.v):"-"}</td><td>${p?`${p.r}位 ${p.r>x.r?'<span class="up">↑</span>':p.r<x.r?'<span class="dn">↓</span>':"→"}`:"-"}</td>`:""}<td class="mem">${mem}</td></tr>`});
 h+=`</table></div><div class="note">エリア平均＝担当エリア内の登録店舗の単純平均。ブランド平均 ${f1(av)}${arKey==2?"%":""}。項目ボタンで切り替え。</div></div>`;
 const all=IK.map(k=>calc(S,k)),cell=(k,a)=>{const r=all[IK.indexOf(k)].find(x=>x.a==a);return r?`<td class="${r.r==1?"hi":""}">${r.r}位<br><small>${f1(r.v)}</small></td>`:"<td>-</td>"};
 h+=`<div class="box"><h3>項目別エリア順位一覧</h3><div class="tw sk1"><table><tr><th>エリア</th>${IK.map(k=>`<th>${LQ(k)}</th>`).join("")}</tr>${R.map(x=>`<tr><td class="n"><b>${x.a}</b></td>${IK.map(k=>cell(k,x.a)).join("")}</tr>`).join("")}</table></div></div>`;
 $("arank").innerHTML=h}

const TABS=["sum","area","store","tend","trend","arank"];
const TN={sum:"全体サマリー",area:"エリア別",store:"店舗詳細",tend:"傾向",trend:"推移比較",arank:"エリアランキング"};
const ORI={store:"P"};
const curTab=()=>document.querySelector("nav button.on").dataset.t;
const PG={L:[1020,660],P:[700,985]};
function printTabs(list){hideQ();render();document.body.classList.add("pm");
 list.forEach(id=>{const el=$(id),o=ORI[id]||"L",[W,H]=PG[o];el.dataset.o=o;el.classList.add("pr");
  const sub=id=="store"?selStore:id=="trend"?"指標："+LAB(trendItem):id=="arank"?"項目："+LAB(arKey):id=="tend"?`${cmpM()}→${cur()}／基準±${TH}pt`:"";
  el.insertAdjacentHTML("afterbegin",`<div class="ph"><b>カンテラゲージ（ES） ${TN[id]}${sub?"　"+sub:""}</b><span>対象：${cur()}${cmpM()?"／比較："+cmpM():""}</span></div>`);
  el.querySelectorAll("label").forEach(l=>{if(l.querySelector("select"))l.classList.add("noprint")});
  el.style.zoom=1;el.style.width=W+"px";let z=1;
  for(let k=0;k<4;k++){const sw=Math.max(el.scrollWidth,W),w=parseFloat(el.style.width);if(sw>w){el.style.width=sw+"px"}
   const ww=parseFloat(el.style.width),h=el.scrollHeight;z=Math.min(1,W/ww,H/h);
   const tw=W/z;if(Math.abs(tw-ww)<4)break;el.style.width=Math.max(W,Math.min(tw,W/0.5))+"px"}
  z=Math.min(1,W/parseFloat(el.style.width),H/el.scrollHeight);if(z>=1){let u=Math.min(1.3,W/680,H/el.scrollHeight);el.style.width=(W/u)+"px";for(let k=0;k<3;k++){u=Math.min(1.3,W/680,H/el.scrollHeight,W/Math.max(el.scrollWidth,W/u));el.style.width=(W/u)+"px"}z=Math.min(u,H/el.scrollHeight)*0.99}el.style.zoom=Math.max(z,0.5).toFixed(3)});
 setTimeout(()=>window.print(),80)}
window.addEventListener("afterprint",()=>{document.body.classList.remove("pm");TABS.forEach(id=>{const el=$(id);el.classList.remove("pr");el.style.zoom="";el.style.width="";el.removeAttribute("data-o")});render()});
function render(){const S=stats(cur()),P=cmpM()?stats(cmpM()):null;renderSum(S,P);renderArea(S,P);renderStore(S,P);renderTend(S,P);renderTrend();renderARank(S,P)}
months.forEach(m=>$("month").add(new Option(m,m)));$("month").value=months.at(-1);
function fillCmp(){const c=$("cmp");c.innerHTML="";c.add(new Option("なし",""));months.filter(m=>m<cur()).reverse().forEach(m=>c.add(new Option(m,m)));if(c.options.length>1)c.selectedIndex=1}
fillCmp();$("month").onchange=()=>{fillCmp();render()};$("cmp").onchange=render;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,.sec").forEach(e=>e.classList.remove("on"));b.classList.add("on");$(b.dataset.t).classList.add("on")});
render();
</script></body></html>
